    <button type="submit" id="btn">Update password</button>

<script type="module">
  // Self-hosted on purpose: this page holds a live password-recovery session,
  // so it must not depend on a third-party CDN staying honest.
  import { createClient } from './vendor/supabase-js-2.112.1.min.js'
  // The recovery session lives in memory only: nothing persists in this browser,
  // which matters on a shared or borrowed computer.
  const supabase = createClient(
    'https://uqiekramqotprubcixgq.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxaWVrcmFtcW90cHJ1YmNpeGdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDQ2MjksImV4cCI6MjEwMTU4MDYyOX0.o1Qmjw95N00x9Ihjpj2Uh6duo6BlgBbGNggwjBeDYiA',
    { auth: { persistSession: false, autoRefreshToken: false } }
  )

  const form = document.getElementById('form')
  const msg = document.getElementById('msg')
  const btn = document.getElementById('btn')
  const show = (text, ok) => { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err') }

  // The recovery link puts a session in the URL; supabase-js picks it up automatically.
  const { data: { session } } = await supabase.auth.getSession()
  if (!session) {
    show('This reset link is invalid or has expired. Request a new one from the app.', false)
    form.style.display = 'none'
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const p1 = document.getElementById('pw1').value
    const p2 = document.getElementById('pw2').value
    if (p1 !== p2) { show('Passwords do not match.', false); return }
    btn.disabled = true
    const { error } = await supabase.auth.updateUser({ password: p1 })
    if (error) { show(error.message, false); btn.disabled = false }
    else {
      show('Password updated ✓ — open the STCKD app and log in.', true)
      form.style.display = 'none'
      await supabase.auth.signOut().catch(() => {})
    }
  })
</script>
